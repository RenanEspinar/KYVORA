name: liftlog
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 8m, max-file: "3"}
  security_opt: [no-new-privileges:true]
services:
  db:
    <<: *service
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: liftlog
      POSTGRES_USER: liftlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera .env con scripts/init_env.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 768m
    cpus: 1.2
    shm_size: 128m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U liftlog -d liftlog"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    <<: *service
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://liftlog:${POSTGRES_PASSWORD:?Falta .env}@db:5432/liftlog
      MEDIA_DIR: /data/media
      REQUIRED_CONFIRMERS: ${REQUIRED_CONFIRMERS:-1}
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES:-52428800}
      MEDIA_TOTAL_BYTES: ${MEDIA_TOTAL_BYTES:-5368709120}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-}
    volumes: [media:/data/media]
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 640m
    cpus: 1.5
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 40s
  gateway:
    <<: *service
    image: nginxinc/nginx-unprivileged:1.28-alpine
    entrypoint: [nginx]
    command: ["-g","daemon off;"]
    depends_on:
      api: {condition: service_healthy}
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    networks:
      internal: {}
      edge:
        aliases: [liftlog-gateway]
    mem_limit: 96m
    cpus: 0.35
    read_only: true
    tmpfs: [/tmp:size=24m,mode=1777]
    cap_drop: [ALL]
networks:
  internal: {internal: true}
  edge:
    name: ${LIFTLOG_EDGE_NETWORK:-liftlog_edge}
    internal: true
volumes:
  pgdata: {}
  media: {}
