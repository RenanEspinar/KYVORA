name: KYVORA build & tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liftlog
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: liftlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U liftlog -d liftlog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://liftlog:disposable-ci-only@localhost:5432/liftlog_test
          ALLOW_DISPOSABLE_TEST_DB: '1'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install pinned Flutter
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.35.6-stable.tar.xz -o /tmp/flutter.tar.xz
          echo '87493b72916f12054176c2a8bbf9547fe63cb5754bdddfe300219d9b57e626af  /tmp/flutter.tar.xz' | sha256sum -c
          tar -xf /tmp/flutter.tar.xz -C /opt
          echo '/opt/flutter/bin' >> "$GITHUB_PATH"
      - name: Build full categorized offline library and matching SVG animations
        run: python scripts/build_complete_library.py --with-media
      - name: Validate curated variants and bilingual search metadata
        run: |
          python scripts/enrich_exercise_catalog.py --check
          python -m unittest discover -s scripts -p 'test_enrich_exercise_catalog.py'
      - name: Validate load-entry method for every exercise
        run: |
          python scripts/assign_load_profiles.py --check
          python -m unittest discover -s scripts -p 'test_load_profiles.py'
      - name: Prefer exercise-specific GIFs, audit remaining motions
        run: python scripts/complete_gif_coverage.py
      - name: Reconcile original exercises with existing Flow animations
        run: python scripts/reconcile_original_motions.py
      - name: Generate original quick guide cards for unmatched exercises
        run: |
          python -m pip install --disable-pip-version-check Pillow==13.0.0
          python scripts/build_guide_cards.py
          python - <<'PYGUIDE'
          import json
          from pathlib import Path
          index=json.loads(Path('mobile/assets/guide_index.json').read_text())
          assert index and all((Path('mobile') / p).exists() for p in index.values())
          print('Verified generated guide cards:',len(index))
          PYGUIDE
      - name: Verify motion coverage audit
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/motion_priority_summary.json').read_text())
          animated=r['authorized_gifs'] + r['flow_svg']
          print('Catalog:',r['total'],'Animated:',animated,'Static:',r['need_original'])
          assert r['total'] == animated + r['need_original']
          PY2
      - name: Upload animation coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kyvora-motion-coverage
          path: |
            reports/motion_coverage.*
            reports/load_profiles.*
            reports/motion_priority_report.csv
            reports/motion_priority_summary.json
            reports/needs_original_animation.json
          if-no-files-found: error
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-pub
        working-directory: mobile
      - run: flutter test --no-pub
        working-directory: mobile
      - name: Configure public Google / Facebook mobile IDs (if supplied)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.KYVORA_GOOGLE_WEB_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ vars.KYVORA_FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ vars.KYVORA_FACEBOOK_CLIENT_TOKEN }}
        run: python scripts/configure_mobile_auth.py
      - run: flutter build apk --release --no-pub --target-platform android-arm64,android-x64 --dart-define-from-file=client-auth-defines.json
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: kyvora-preview-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
