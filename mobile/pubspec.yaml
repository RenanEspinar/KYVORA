name: liftlog
description: Registro de entrenamiento y comunidad autoalojada.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 16.2.4
  drift: 2.28.2
  sqlite3_flutter_libs: 0.5.40
  path_provider: 2.1.5
  dio: 5.9.0
  fl_chart: 1.1.1
  flutter_secure_storage: 9.2.4
  flutter_svg: 2.2.1
  uuid: 4.5.1
  image_picker: 1.2.0
  share_plus: 11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/levels.json
    - assets/maps/
