name: liftlog
description: KYVORA — entrenamiento, progreso y comunidad autoalojada.
publish_to: none
version: 2.7.0+14
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 16.2.4
  drift: 2.28.2
  sqlite3_flutter_libs: 0.5.40
  path_provider: 2.1.5
  dio: 5.9.0
  fl_chart: 1.1.1
  flutter_secure_storage: 9.2.4
  flutter_svg: 2.2.1
  uuid: 4.5.1
  image_picker: 1.2.0
  share_plus: 11.1.0
  google_sign_in: 7.2.0
  flutter_facebook_auth: 7.1.5
  url_launcher: 6.3.2
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/guides/
    - assets/guide_index.json
    - assets/catalog.json
    - assets/levels.json
    - assets/maps/
    - assets/motion_index.json
    - assets/flow_frames/
    - assets/exercise_gifs/
